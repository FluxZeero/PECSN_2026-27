[General]
network = DualLinkAeronauticalNetwork
sim-time-limit = 1000s
num-rngs = 3
**.numberOfAircrafts = 1

**.ansp.traffic[*].rng-0 = 0
**.ansp.traffic[*].rng-1 = 1
**.ansp.traffic[*].rng-2 = 2

repeat = 1
seed-set = ${repetition}
warmup-period = 0s

**.Dt = 100ms
**.Bt = 32kbps

[Config TestRun]

repeat = 1
seed-set = ${repetition}
**.p = 0.5
**.numberOfAircrafts = 10
**.interGenerationTime = exponential(${meaninterGenerationTime = 1.75s}, 1)
**.size = int(exponential(150B, 0))
# **.size = intuniform(50B, 250B, 0)

[Config FullFactor]
repeat = 30
seed-set = ${repetition}
**.p = ${p=0.0..1 step 0.1}
**.numberOfAircrafts = ${N=10..80 step 10}
**.interGenerationTime = exponential(1.75s, 1)
#**.size = int(exponential(150B))
**.size = intuniform(50B, 250B, 0)

[Config Validation]

sim-time-limit = 60s
**.numberOfAircrafts = 1
**.alternatingMsg = true
**.interGenerationTime = 25ms
**.size = 150B

[Config ConsistencyTest]

sim-time-limit = 100s
**.numberOfAircrafts = 1
**.interGenerationTime = exponential(0.025s, 1)
**.size = int(exponential(150B), 0)

[Config DegeneracyTest]

sim-time-limit = 1000s
**.numberOfAircrafts = 1
**.Dt = 0s
**.interGenerationTime = exponential(10s, 1)
**.size = int(exponential(150B), 0)

[Config DegeneracyTestPackets]

sim-time-limit = 1000s
**.alternatingMsg = true
**.numberOfAircrafts = 1
**.Bt = 32kbps
**.Dt = 100ms
**.interGenerationTime = exponential(10s, 1)
**.size = 0B

[Config ContinuityTest]

sim-time-limit = 1000s
**.numberOfAircrafts = 30
**.p = 0.5
**.interGenerationTime = exponential(${meanIAT=1.5..1.75 step 0.25}s, 1)
**.size = int(exponential(150B), 0)

[Config SimpleTest]

**.numberOfAircrafts = 60
**.p = 0.5
**.interGenerationTime = exponential(1.75s, 1)
**.size = int(exponential(150B), 0)
